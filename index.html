<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vue3 CDN App</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon" />
  <style>
    .app-preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      color: #1f2937;
      background: #f8fafc;
      transition: opacity 0.24s ease, visibility 0.24s ease;
    }

    .app-preloader--hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .app-preloader__box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .app-preloader__spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #dbe3ee;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: app-preloader-spin 0.8s linear infinite;
    }

    .app-preloader__text {
      font-size: 14px;
      line-height: 20px;
      color: #64748b;
    }

    @keyframes app-preloader-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-preloader {
        transition: none;
      }

      .app-preloader__spinner {
        animation: none;
      }
    }
  </style>
  <!-- 合并后的第三方依赖打包库 -->
  <script src="./assets/libs/vendor.min.js"></script>

</head>

<body>
  <div id="app-preloader" class="app-preloader" aria-live="polite" aria-label="应用加载中">
    <div class="app-preloader__box">
      <div class="app-preloader__spinner"></div>
      <span class="app-preloader__text">加载中...</span>
    </div>
  </div>
  <div id="app"></div>

  <script src="./config.js"></script>
  <script src="./utils/utils.js"></script>
  <script src="./utils/loader.js"></script>
  <script src="./stores/counter.js"></script>
  <script src="./stores/app.js"></script>
  <script type="module" src="./main.js"></script>
</body>

</html>
